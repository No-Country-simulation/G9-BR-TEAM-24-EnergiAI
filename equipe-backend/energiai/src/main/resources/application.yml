server:
  port: ${PORT:8080}

spring:
  application:
    name: energiAI-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local} # Define 'local' se nada for informado

management:
  endpoints:
    web:
      exposure:
        include: health,info # Expõe apenas dados seguros do Actuator

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
